# The Diia codegen recipe. Shipped from @diia-inhouse/configs so consumer services
# and ci-builder reference one source instead of keeping their own copies.
#
# Invoked via:
#   buf generate --template ./node_modules/@diia-inhouse/configs/buf/buf.gen.yaml
#
# Paths in `inputs:`/`out:` resolve relative to the consumer's cwd, and the plugin
# binary resolves from node_modules/.bin (also shipped by @diia-inhouse/configs).
version: v2
inputs:
    - directory: proto
plugins:
    - local: ./node_modules/.bin/protoc-gen-diia-ts
      out: proto/gen/ts
